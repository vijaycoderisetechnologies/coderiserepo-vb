apiVersion: apps/v1
kind: Deployment
metadata:
  name: myrelease-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myrelease-app
  template:
    metadata:
      labels:
        app: myrelease-app
    spec:
      imagePullSecrets:
        - name: my-registry-secret
      containers:
        - name: my-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          resources:  
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"