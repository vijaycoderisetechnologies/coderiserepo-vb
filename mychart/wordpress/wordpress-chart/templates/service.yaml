apiVersion: v1
kind: Service
metadata:
  name: mywordpress
  labels:
    {{- include "wordpress-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "wordpress-chart.selectorLabels" . | nindent 4 }}
