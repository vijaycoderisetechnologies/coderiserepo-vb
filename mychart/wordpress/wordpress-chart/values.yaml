wordpressUsername: admin
wordpressPassword: password
wordpressEmail: admin@example.com

service:
  type: NodePort
  port: 80

mysql:
  host: mywordpress-mysql
  user: root
  password: rootpassword
  database: wordpress
  secretName: mywordpress-mysql-secret

serviceAccount:
  create: true
  name: "wordpress-sa"
ingress:
  enabled: true
  annotations: {}
  hosts:
    - host: wordpress.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
autoscaling:
  enabled: true 
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

