
name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main  # Trigger on push to main branch (change as needed)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Azure CLI Login Success
      run: echo "Logged in to Azure successfully!"

    - name: Docker Login to ACR
      run: az acr login --name tempvgacr 

    - name: Build Docker Image
      run: |
        docker build -t <ACR-LOGIN-SERVER>/<REPO-NAME>:${{ github.sha }} .
        docker tag tempvgacr.azurecr.io:mywebsite:${{ github.sha }} tempvgacr.azurecr.io:mywebsite:latest

    - name: Push Docker Image (Git SHA Tag)
      run: docker push tempvgacr.azurecr.io:mywebsite:${{ github.sha }}

    - name: Push Docker Image (Latest Tag)
      run: docker push tempvgacr.azurecr.io:mywebsite:latest
